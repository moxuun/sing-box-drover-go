; sing-box-dover-go 的示例配置。
; 配置文件名和节名请保留 sing-box-drover，方便兼容现有安装。
; 所有二值选项统一使用 on/off；解析器仍兼容旧配置中的 0/1 等写法。
[sing-box-drover]

; sing-box.exe 所在目录。
; 留空时，程序会在配置文件所在目录查找 sing-box.exe。
sb-dir =

; sing-box 的源配置文件，可以是 config.json 或绝对路径。
; 相对路径会优先从配置文件所在目录解析，也可以配合 sb-dir 使用。
sb-config-file = config.json

; 是否在程序启动时自动开启系统代理。
; off = 不自动开启（可在托盘中手动切换）；on = 自动开启，退出时关闭。
system-proxy-auto = off

; 是否在程序启动时自动开启 TUN。
; off = 不自动开启；on = 自动开启。配置中需要存在 tun 入站，可能会请求 UAC。
tun-start-mode = off

; 选择器菜单布局。
; auto = 根据节点数量自动选择；flat = 平铺显示；nested = 每个选择器使用子菜单。
selector-menu-layout = auto

; 日志文件路径。相对路径以配置文件所在目录为基准；留空则不写日志文件。
log-file = sing-box-drover.log

; 托盘菜单 Homepage 要打开的网页地址，只支持 http:// 或 https://。
; 可以改成你的本地 Web 面板，例如 http://127.0.0.1:9090/ui/。
homepage-url = 
