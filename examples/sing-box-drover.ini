; sing-box-drover-go 配置文件
; 选项支持 on / off，修改后重启程序生效。
[sing-box-drover]

; sing-box 内核所在目录（留空则默认在当前目录查找 sing-box.exe / sing-box）
sb-dir =

; 配置文件名称或路径（相对路径以当前目录为准）
sb-config-file = config.json

; 启动时是否自动开启系统代理（off: 手动开启 / on: 启动即开启）
system-proxy-auto = off

; 启动时是否自动开启 TUN 虚拟网卡（需要 config.json 中有 tun 入站，会弹出管理员授权）
tun-start-mode = off

; 节点选择器菜单样式（auto: 自动 / flat: 平铺展示 / nested: 二级菜单折叠）
selector-menu-layout = auto

; 运行日志保存路径（留空则不记录日志）
log-file = sing-box-drover.log

; 托盘菜单中「Homepage」打开的网址（留空默认打开本仓库；可填 Web 控制台如 http://127.0.0.1:9090/ui/）
homepage-url =
