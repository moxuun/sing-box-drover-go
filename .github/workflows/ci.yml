name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }} 检查
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.25.14
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true

      - name: 检查格式
        shell: bash
        run: |
          files=$(gofmt -l cmd internal tools)
          if [[ -n "$files" ]]; then
            echo "以下文件未经过 gofmt："
            echo "$files"
            exit 1
          fi

      - name: 运行测试
        shell: bash
        run: go test -count=1 ./...

      - name: 运行静态检查
        shell: bash
        run: go vet ./...
