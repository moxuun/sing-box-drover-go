name: 自动构建并发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }} 发布包
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            platform: windows
          - name: macOS universal
            os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.25.14
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true

      - name: 检查格式
        shell: bash
        run: |
          files=$(gofmt -l cmd internal tools)
          if [[ -n "$files" ]]; then
            echo "以下文件未经过 gofmt："
            echo "$files"
            exit 1
          fi

      - name: 运行测试
        shell: bash
        run: go test -count=1 ./...

      - name: 运行静态检查
        shell: bash
        run: go vet ./...

      - name: 构建 Windows 程序
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build.ps1 -OutputPath build\sing-box-dover-go.exe

      - name: 打包 Windows 发布包
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME
          $stage = Join-Path $env:RUNNER_TEMP "sing-box-dover-go-$version"
          $package = Join-Path $env:GITHUB_WORKSPACE "dist\sing-box-dover-go-$version-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item build\sing-box-dover-go.exe $stage
          Copy-Item examples\sing-box-drover.ini (Join-Path $stage "sing-box-drover.ini")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $package -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $package)" | Set-Content -NoNewline -Encoding ascii "$package.sha256"

      - name: 构建 macOS 程序
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" ./scripts/build-macos.sh build/sing-box-drover.app

      - name: 打包 macOS 发布包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/sing-box-drover-$version"
          package="$GITHUB_WORKSPACE/dist/sing-box-drover-$version-macos-universal.zip"
          mkdir -p "$stage" dist
          cp -R build/sing-box-drover.app "$stage/"
          cp build/sing-box-drover.ini "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$package"
          (cd dist && shasum -a 256 "$(basename "$package")" > "$(basename "$package").sha256")

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "sing-box-drover-go $GITHUB_REF_NAME" \
            --generate-notes
